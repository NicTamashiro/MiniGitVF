<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="780" height="300" rx="12" fill="#ffffff"/>

  <!-- arquivo -->
  <rect x="20" y="58" width="110" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="75" y="85" text-anchor="middle" font-size="16" fill="#0f172a">arquivo</text>

  <!-- staging: FILA -->
  <rect x="220" y="45" width="200" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="76" text-anchor="middle" font-size="17" font-weight="600" fill="#1e3a8a">staging</text>
  <text x="320" y="98" text-anchor="middle" font-size="13" fill="#1e40af">FILA (FIFO)</text>

  <!-- histórico: LISTA -->
  <rect x="560" y="45" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="76" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">histórico</text>
  <text x="660" y="98" text-anchor="middle" font-size="13" fill="#166534">LISTA (ordem dos commits)</text>

  <!-- stash: PILHA -->
  <rect x="220" y="210" width="200" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="241" text-anchor="middle" font-size="17" font-weight="600" fill="#78350f">stash</text>
  <text x="320" y="263" text-anchor="middle" font-size="13" fill="#92400e">PILHA (LIFO)</text>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#seta)">
    <line x1="132" y1="80" x2="216" y2="80"/>   <!-- add -->
    <line x1="422" y1="80" x2="556" y2="80"/>   <!-- commit -->
    <line x1="360" y1="117" x2="360" y2="206"/> <!-- stash -->
    <line x1="280" y1="208" x2="280" y2="119"/> <!-- stash pop -->
  </g>
  <g font-size="14" fill="#334155" font-family="Consolas, Menlo, monospace">
    <text x="174" y="70" text-anchor="middle">add</text>
    <text x="489" y="70" text-anchor="middle">commit</text>
    <text x="370" y="167">stash</text>
    <text x="270" y="167" text-anchor="end">stash pop</text>
  </g>
</svg>
