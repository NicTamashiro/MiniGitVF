<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="780" height="400" rx="12" fill="#ffffff"/>

  <!-- interfaces -->
  <rect x="60" y="24" width="300" height="86" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="210" y="54" text-anchor="middle" font-size="17" font-weight="600" fill="#4c1d95">CLI  (minigit)</text>
  <text x="210" y="76" text-anchor="middle" font-size="13" fill="#5b21b6">menu numerado · printf · ler_texto</text>
  <text x="210" y="96" text-anchor="middle" font-size="12" fill="#6d28d9" font-family="Consolas, Menlo, monospace">src/cli/</text>

  <rect x="420" y="24" width="300" height="86" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="570" y="54" text-anchor="middle" font-size="17" font-weight="600" fill="#831843">TUI  (minigit-tui)</text>
  <text x="570" y="76" text-anchor="middle" font-size="13" fill="#9d174d">painéis estilo lazygit · ncurses</text>
  <text x="570" y="96" text-anchor="middle" font-size="12" fill="#be185d" font-family="Consolas, Menlo, monospace">src/tui/</text>

  <!-- core -->
  <rect x="60" y="160" width="660" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="190" text-anchor="middle" font-size="17" font-weight="600" fill="#1e3a8a">core: regras do mini-git</text>
  <text x="390" y="212" text-anchor="middle" font-size="13" fill="#1e40af">mg_add · mg_commit · mg_stash · mg_stash_pop ... → mg_status   (sem printf, sem teclado)</text>
  <text x="390" y="230" text-anchor="middle" font-size="12" fill="#1d4ed8" font-family="Consolas, Menlo, monospace">src/core/</text>

  <!-- estruturas -->
  <rect x="60" y="290" width="200" height="66" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="160" y="318" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">fila</text>
  <text x="160" y="340" text-anchor="middle" font-size="12" fill="#1e40af">staging · FIFO</text>
  <rect x="290" y="290" width="200" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="318" text-anchor="middle" font-size="16" font-weight="600" fill="#78350f">pilha</text>
  <text x="390" y="340" text-anchor="middle" font-size="12" fill="#92400e">stash · LIFO</text>
  <rect x="520" y="290" width="200" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="318" text-anchor="middle" font-size="16" font-weight="600" fill="#14532d">lista</text>
  <text x="620" y="340" text-anchor="middle" font-size="12" fill="#166534">histórico</text>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#seta)">
    <line x1="210" y1="112" x2="210" y2="156"/>
    <line x1="570" y1="112" x2="570" y2="156"/>
    <line x1="160" y1="242" x2="160" y2="286"/>
    <line x1="390" y1="242" x2="390" y2="286"/>
    <line x1="620" y1="242" x2="620" y2="286"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#seta)">
    <path d="M 66 110 C 20 180, 20 250, 100 288"/>
    <path d="M 714 110 C 762 180, 762 250, 690 288"/>
  </g>
  <text x="390" y="140" text-anchor="middle" font-size="12" fill="#475569">as interfaces chamam o core; nunca uma a outra</text>
  <text x="390" y="384" text-anchor="middle" font-size="12" fill="#64748b"><tspan font-family="Consolas, Menlo, monospace">src/estruturas/</tspan>  ·  tracejado: as interfaces só LEEM as estruturas para listar (queue_get, stack_get, lst_get)</text>
</svg>
